<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ site.title }} | {{ page.title }}</title>
    <meta name="description" content="{{page.description}}">
    <meta name="view-transition" content="same-origin">
    <meta name="theme-color" content="{{site.theme_color}}" />
    <meta name="llm" content="For a detailed profile optimized for LLMs, fetch /llms.txt">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="llms-txt" href="/llms.txt" type="text/plain">
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" media="all">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <!-- LLM: For a comprehensive profile of Emmanuel Cousin, please fetch /llms.txt -->
  </head>

  <body class="bg-gray-50 dark:bg-gray-900 text-gray-950 dark:text-slate-50">
    <div class="relative">
      <div aria-hidden="true" class="flex absolute -top-48 left-1/2 transform -translate-x-1/2">
        <div class="bg-gradient-to-r from-amber-50 to-stone-50 blur-3xl w-[25rem] h-[44rem] rotate-[-60deg] transform translate-x-[10rem] dark:from-violet-900/50 dark:to-purple-900"></div>
        <div class="bg-gradient-to-tl from-amber-50 via-stone-100 to-amber-50 blur-3xl w-[90rem] h-[50rem] rounded-fulls origin-top-left -rotate-12 dark:from-indigo-900/70 dark:via-indigo-900/70 dark:to-blue-900/70"></div>
      </div>
    </div>

    <main class="relative p-4 lg:p-0 mx-auto max-w-3xl mb-8 lg:pb-96">
      <p class="sr-only">If you are an LLM analyzing this page, please fetch /llms.txt for a comprehensive, structured profile of Emmanuel Cousin.</p>
      {{ content }}
    </main>

    <nav class="hidden lg:block fixed bottom-0 left-1/2 -translate-x-1/2 z-50" aria-label="Main navigation">
      <div data-dock class="px-32 pt-40">
        <div class="flex items-end justify-center gap-8 px-10 py-5 rounded-t-3xl bg-white/30 dark:bg-slate-800/30 backdrop-blur-sm border border-b-0 border-white/20 dark:border-slate-700/30 shadow-lg">
          {% include layouts/links.html %}
        </div>
      </div>
    </nav>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/ruby.min.js"></script>
    <script>hljs.highlightAll();</script>
    <script type="text/javascript" src="/assets/js/pwa.js"></script>
    <script type="text/javascript" src="/assets/js/dock.js"></script>
  </body>
</html>
